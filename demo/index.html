<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicEye ONNX — browser tester</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:18px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; font-weight:600; color:#94a3b8; margin:10px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  input[type=text], select, textarea { width:100%; background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:13px; font-family:ui-monospace, monospace; }
  textarea { min-height:52px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .row > div { flex:1; min-width:180px; }
  button { background:#2563eb; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; margin-top:12px; }
  button:hover { background:#1d4ed8; }
  button:disabled { background:#475569; cursor:not-allowed; }
  .drop { border:2px dashed #334155; border-radius:12px; padding:28px; text-align:center; color:#94a3b8; cursor:pointer; transition:.15s; }
  .drop.over { border-color:#3b82f6; color:#93c5fd; background:#1e293b; }
  #stage { position:relative; display:inline-block; max-width:100%; }
  canvas { max-width:100%; height:auto; border-radius:8px; background:#000; display:block; }
  #log { font-family:ui-monospace, monospace; font-size:12px; color:#7dd3fc; white-space:pre-wrap; max-height:160px; overflow:auto; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:10px; margin-top:12px; }
  .badge { display:inline-block; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:2px 8px; font-size:12px; color:#94a3b8; margin-left:8px; font-weight:400; }
</style>
</head>
<body>
  <h1>👁️ CivicEye — ONNX model tester <span class="badge">onnxruntime-web · WASM</span></h1>
  <div class="sub">Runs the model exactly like the CivicEye app: jsDelivr-hosted model + onnxruntime-web.</div>

  <div class="card">
    <label>Model URL (jsDelivr / any CORS-enabled URL)</label>
    <input type="text" id="modelUrl" value="https://cdn.jsdelivr.net/gh/Crepify/CivicEyeModel/models/civiceye-int8.onnx">
    <div class="row">
      <div>
        <label>Class labels (comma-separated, in model order)</label>
        <textarea id="labels" placeholder="pothole,garbage,manhole,...">pothole,broken-road,garbage,sidewalk,manhole,fallen-tree,street-light,water-leakage,sewage,illegal-dumping,other</textarea>
      </div>
      <div>
        <label>Box coordinate space</label>
        <select id="coordSpace">
          <option value="pixels" selected>Pixels (0–640) — this model</option>
          <option value="normalized">Normalized (0–1)</option>
        </select>
      </div>
      <div>
        <label>Confidence</label>
        <input type="text" id="conf" value="0.30">
      </div>
    </div>
    <button id="loadBtn">Load model</button>
    <div id="log"></div>
  </div>

  <div class="card">
    <div class="drop" id="drop">📷 Click or drop a photo here (JPEG/PNG)</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <div id="stageWrap" style="margin-top:14px; display:none;">
      <div id="stage"><canvas id="canvas" width="640" height="640"></canvas></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

let session = null;
let img = null; // original image element

// ---------------- model loading ----------------
$('loadBtn').onclick = async () => {
  log('Loading onnxruntime-web…');
  await ensureOrt();
  try {
    log('Creating session from: ' + $('modelUrl').value);
    session = await ort.InferenceSession.create($('modelUrl').value, { executionProviders: ['wasm'] });
    log('✅ Session ready. inputs: ' + session.inputNames.join(',') + ' | outputs: ' + session.outputNames.join(','));
  } catch (e) {
    log('❌ Failed to load model: ' + e.message);
  }
};

let ort = null;
async function ensureOrt() {
  if (ort) return;
  const win = window;
  if (win.ort) { ort = win.ort; return; }
  // Fallback: dynamic import from CDN (only if the script tag didn't load)
  const mod = await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs');
  ort = mod;
  win.ort = ort;
}

// ---------------- image input ----------------
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = () => { if (file.files[0]) loadImage(file.files[0]); };
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadImage(f); });

function loadImage(f) {
  const url = URL.createObjectURL(f);
  img = new Image();
  img.onload = () => { $('stageWrap').style.display = 'block'; runInference(); };
  img.src = url;
}

// ---------------- inference ----------------
async function runInference() {
  if (!session) { log('⚠️ Load the model first.'); $('loadBtn').click(); return; }
  if (!img) return;
  const t0 = performance.now();
  const { tensor, scale, padX, padY } = preprocess(img);
  log('Preprocessed ' + img.naturalWidth + '×' + img.naturalHeight + ' → 640×640 (' + (performance.now()-t0).toFixed(0) + 'ms)');

  const t1 = performance.now();
  const results = await session.run({ images: new ort.Tensor('float32', tensor, [1, 3, 640, 640]) });
  const out = results[session.outputNames[0]];
  log('Inference done in ' + (performance.now()-t1).toFixed(0) + 'ms → dims ' + out.dims);

  const dets = decode(out.data, { scale, padX, padY });
  draw(dets);
  log('Detections: ' + dets.length);
  log('────────────────────────────────');
}

function preprocess(srcImg) {
  const S = 640;
  const scale = Math.min(S / srcImg.naturalWidth, S / srcImg.naturalHeight);
  const nw = Math.max(1, Math.round(srcImg.naturalWidth * scale));
  const nh = Math.max(1, Math.round(srcImg.naturalHeight * scale));
  const padX = (S - nw) / 2, padY = (S - nh) / 2;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#727272';
  ctx.fillRect(0, 0, S, S);
  ctx.drawImage(srcImg, padX, padY, nw, nh);
  const { data } = ctx.getImageData(0, 0, S, S);
  const n = S * S;
  const tensor = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    const p = i * 4;
    tensor[i] = data[p] / 255;
    tensor[n + i] = data[p + 1] / 255;
    tensor[2 * n + i] = data[p + 2] / 255;
  }
  return { tensor, scale, padX, padY };
}

function decode(data, { scale, padX, padY }) {
  const conf = parseFloat($('conf').value) || 0.3;
  const labels = $('labels').value.split(',').map(s => s.trim()).filter(Boolean);
  const N = 15, anchors = 8400;
  const raw = new Float32Array(data.buffer, data.byteOffset, data.length);
  const boxes = [];
  const coordSpace = $('coordSpace').value;

  for (let i = 0; i < anchors; i++) {
    const o = i * N;
    let cx = raw[o], cy = raw[o+1], w = raw[o+2], h = raw[o+3];
    if (w <= 0 || h <= 0) continue;
    // class scores are raw[o+4 .. o+14]
    let best = 0, bestScore = -Infinity;
    for (let c = 4; c < N; c++) {
      const s = raw[o + c];
      if (s > bestScore) { bestScore = s; best = c - 4; }
    }
    if (bestScore < conf) continue;
    // map to ORIGINAL image pixel coordinates
    let x1, y1, x2, y2;
    if (coordSpace === 'normalized') {
      x1 = (cx - w/2) * img.naturalWidth;  y1 = (cy - h/2) * img.naturalHeight;
      x2 = (cx + w/2) * img.naturalWidth;  y2 = (cy + h/2) * img.naturalHeight;
    } else {
      x1 = (cx - w/2 - padX) / scale;      y1 = (cy - h/2 - padY) / scale;
      x2 = (cx + w/2 - padX) / scale;      y2 = (cy + h/2 - padY) / scale;
    }
    boxes.push({ label: labels[best] || 'class-' + best, score: bestScore,
                 box: { xmin: x1, ymin: y1, xmax: x2, ymax: y2 } });
  }
  return nms(boxes, 0.45);
}

function nms(boxes, iouTh) {
  const sorted = [...boxes].sort((a, b) => b.score - a.score);
  const kept = [];
  for (const b of sorted) {
    if (kept.some(k => k.label === b.label && iou(k.box, b.box) >= iouTh)) continue;
    kept.push(b);
    if (kept.length >= 64) break;
  }
  return kept;
}
function iou(a, b) {
  const x1 = Math.max(a.xmin, b.xmin), y1 = Math.max(a.ymin, b.ymin);
  const x2 = Math.min(a.xmax, b.xmax), y2 = Math.min(a.ymax, b.ymax);
  const inter = Math.max(0, x2-x1) * Math.max(0, y2-y1);
  const union = (a.xmax-a.xmin)*(a.ymax-a.ymin) + (b.xmax-b.xmin)*(b.ymax-b.ymin) - inter;
  return union > 0 ? inter/union : 0;
}

// ---------------- drawing ----------------
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f43f5e','#a3e635'];
function draw(dets) {
  const S = 640;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#727272'; ctx.fillRect(0, 0, S, S);
  ctx.drawImage(img, (S - Math.min(S/img.naturalWidth, S/img.naturalHeight)*img.naturalWidth)/2,
                    (S - Math.min(S/img.naturalWidth, S/img.naturalHeight)*img.naturalHeight)/2,
                    Math.min(S/img.naturalWidth, S/img.naturalHeight)*img.naturalWidth,
                    Math.min(S/img.naturalWidth, S/img.naturalHeight)*img.naturalHeight);
  const sx = S / img.naturalWidth, sy = S / img.naturalHeight;
  dets.forEach((d, i) => {
    const col = COLORS[i % COLORS.length];
    const x = d.box.xmin * sx, y = d.box.ymin * sy;
    const w = (d.box.xmax - d.box.xmin) * sx, h = (d.box.ymax - d.box.ymin) * sy;
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    const label = `${d.label} ${(d.score*100).toFixed(0)}%`;
    ctx.font = 'bold 22px system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = col; ctx.fillRect(x, Math.max(0, y-26), tw+10, 26);
    ctx.fillStyle = '#000'; ctx.fillText(label, x+5, Math.max(18, y-7));
  });
  $('canvas').getContext('2d').drawImage(c, 0, 0);
}
</script>
</body>
</html>
